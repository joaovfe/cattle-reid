services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cattle
      POSTGRES_PASSWORD: cattle
      POSTGRES_DB: cattle_reid
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cattle -d cattle_reid"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - cattle-net

networks:
  cattle-net:
    driver: bridge

volumes:
  postgres_data:

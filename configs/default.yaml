# Cattle Re-ID Drone — config padrão
# Objetivo: mais recall na detecção + re-ID conservador (alvo típico >90% precisão nos matches).
# Valida com vídeo anotado: --gt_count e revise falsos antes de afrouxar similarity_threshold.
#
# Parâmetros de HARDWARE (device, half, imgsz, batch_size, frame_skip, model_name) são
# definidos em configs/profiles/gpu.yaml ou configs/profiles/cpu.yaml e aplicados
# automaticamente sobre este arquivo. Configure via NOVUS_PROFILE=gpu|cpu no .env.
# Se não definido, o perfil é detectado automaticamente (CUDA disponível → gpu, senão → cpu).

app:
  env: development
  log_level: INFO

database:
  url: postgresql+asyncpg://cattle:cattle@localhost:5432/cattle_reid
  echo: false

models:
  yolo:
    weights: models/best_cow.pt  # modelo treinado (detecção bovinos)
    conf_threshold: 0.43   # menor = mais bbox (recall); NMS/refino no re-id/track
    iou_threshold: 0.52    # maior NMS IoU em multidão → menos fusão entre indivíduos próximos
    max_det: 300
    allowed_class_names: [“cow”]
    half: false  # sobrescrito pelo perfil de hardware
  classifier:
    # Classificador (ex.: pose). Usado para metadata/eventos; não interfere no Re-ID por embeddings.
    weights: models/cow_pose_classifier.pt
    backend: ultralytics  # ultralytics | torchscript (fallback)
    device: cpu  # sobrescrito pelo perfil de hardware
    half: false
  embedding:
    model_name: facebook/dinov2-small  # sobrescrito pelo perfil de hardware (gpu usa dinov3)
    device: cpu  # sobrescrito pelo perfil de hardware
    output_size: 384
    half: false
  faiss:
    index_path: ./core/data/faiss_index
    metric_type: cosine  # cosine or l2

tracking:
  tracker: bytetrack  # bytetrack or deepsort
  max_age: 55           # segurar associações por mais tempo em oclusões → menos re-IDs como novos animais
  iou_threshold: 0.38  # ≥ match com IoU; maior = menos troca de track_id quando a vaca reaparece após oclusão

reid:
  similarity_threshold: 0.4530  # τ calibrado no treino Re-ID (época 16, Recall@1=0.996)
  top1_top2_margin: 0.12     # reforço contra confusão entre galería semelhante
  min_embeddings_per_tracklet: 10  # média antes de aceitar decisão estável (corta tracks curtos espúrios)
  duplicate_tracklet_similarity: 0.80  # τ p/ fundir tracklets desconhecidos duplicados (1 vaca → 1 tracklet)
  aggregate: mean

oriented_crop:
  output_size: 224
  padding: 0.1  # fraction of bbox

inference:
  frame_skip: 2  # sobrescrito pelo perfil de hardware
  # Redimensiona o lado longo no YOLO (4K/evitar “NMS time limit exceeded”); null = defeito Ultralytics
  imgsz: 640   # sobrescrito pelo perfil de hardware
  batch_embedding: true
  batch_size: 4  # sobrescrito pelo perfil de hardware
  require_classifier: true
  crops_per_tracklet: 4  # mais amostras por tracklet quando min_embeddings aumentou

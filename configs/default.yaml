# Cattle Re-ID Drone — config padrão
# Para acurácia >95%: treine YOLO no seu dataset de gado, use --gt_count para métricas
# e ajuste conf_threshold / similarity_threshold com base em validação.

app:
  env: development
  log_level: INFO

database:
  url: postgresql+asyncpg://cattle:cattle@localhost:5432/cattle_reid
  echo: false

models:
  yolo:
    weights: models/best_cow.pt  # modelo treinado (detecção bovinos)
    conf_threshold: 0.55   # >0.5 para maior precisão (menos falsos positivos)
    iou_threshold: 0.45
    max_det: 300
    allowed_class_names: ["cow"]
    half: true  # fp16 para GPU, mais rápido
  classifier:
    # Classificador (ex.: pose). Usado para metadata/eventos; não interfere no Re-ID por embeddings.
    weights: models/cow_pose_classifier.pt
    backend: ultralytics  # ultralytics | torchscript (fallback)
    device: cuda
    half: true
  embedding:
    # DINOv2 (livre). DINOv3 (facebook/dinov3-vits16-pretrain-lvd1689m) é gated: requer login HF e aceite de licença.
    model_name: facebook/dinov2-small
    device: cuda
    output_size: 384
    half: true
  faiss:
    index_path: ./core/data/faiss_index
    metric_type: cosine  # cosine or l2

tracking:
  tracker: bytetrack  # bytetrack or deepsort
  max_age: 30
  iou_threshold: 0.3

reid:
  similarity_threshold: 0.45  # limiar conservador para evitar falso positivo
  top1_top2_margin: 0.10  # exige separação mínima entre o melhor e o segundo candidato
  min_embeddings_per_tracklet: 4  # mais embeddings = decisão mais estável
  aggregate: mean

oriented_crop:
  output_size: 224
  padding: 0.1  # fraction of bbox

inference:
  frame_skip: 1  # process every N frames
  batch_embedding: true
  batch_size: 16
  require_classifier: true
  crops_per_tracklet: 3  # quantas imagens salvar por tracklet (auto-cadastro/registro)

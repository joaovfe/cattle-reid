[project]
name = "cattle-reid-drone"
version = "0.1.0"
description = "Sistema de identificação de bovinos por drone: Detection → Tracking → Oriented Crop → Embedding → FAISS → Identity Decision."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "opencv-python>=4.8",
    "pillow>=10.0",
    "torch>=2.0",
    "torchvision>=0.15",
    "transformers>=4.45",
    "timm>=1.0",
    "ultralytics>=8.0",
    "faiss-cpu>=1.7",
    "pyyaml>=6.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "psycopg2-binary>=2.9",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
]

[project.optional-dependencies]
dev = ["ruff>=0.6", "pytest>=8.0", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "core*"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
